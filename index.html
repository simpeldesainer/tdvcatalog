<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDV — Catalogue Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0E0E0E;--surface:#181818;--card:#1C1C1C;--border:#2C2C2C;--gold:#C9A84C;--text:#F0EDE6;--muted:#7A7570;--pill:#222220}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
header{position:sticky;top:0;z-index:100;background:rgba(14,14,14,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;padding:0 32px;height:60px}
.logo{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:15px;letter-spacing:.28em;color:var(--gold);flex-shrink:0;white-space:nowrap}
.logo em{color:var(--muted);font-style:normal;letter-spacing:0}
.sb{flex:1;max-width:300px;position:relative}
.sb input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;font-size:13px;padding:7px 34px 7px 13px;border-radius:4px;outline:none;transition:border-color .2s}
.sb input::placeholder{color:var(--muted)}
.sb input:focus{border-color:var(--gold)}
.sb svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
#count{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.sw{position:sticky;top:60px;z-index:99;background:rgba(14,14,14,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:0 24px}
.strip{display:flex;gap:4px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;background:var(--pill);border:1px solid var(--border);color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;font-size:11.5px;padding:5px 14px;border-radius:100px;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;user-select:none}
.pill span{font-size:10px;opacity:.6}
.pill:hover{border-color:var(--gold);color:var(--text)}
.pill.on{background:var(--gold);border-color:var(--gold);color:#0E0E0E}
.pill.on span{opacity:.7}
main{padding:28px 32px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;background:var(--card);border:1px solid var(--border);transition:transform .22s,border-color .22s;aspect-ratio:3/4;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:#505050}
.card.hide{display:none}
.thumb{flex:1;position:relative;overflow:hidden;background:var(--surface)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .thumb img{transform:scale(1.05)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.ph svg{opacity:.1}
.ph span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:.5}
.grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.72)100%);pointer-events:none}
.ob{position:absolute;bottom:12px;right:12px;z-index:2;background:var(--gold);color:#0E0E0E;font-family:'DM Sans',sans-serif;font-weight:500;font-size:10px;letter-spacing:.05em;padding:5px 13px;border-radius:3px;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .2s}
.card:hover .ob{opacity:1;transform:translateY(0)}
.meta{padding:10px 12px 12px;flex-shrink:0}
.ct{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.ttl{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:15px;line-height:1.3}
.mbg{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.9);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.mbg.open{display:flex}
.modal{position:relative;width:100%;max-width:960px;height:90vh;background:#111;border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.mbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:#0E0E0E}
.minfo .mt{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:17px;color:var(--text)}
.minfo .mc{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:2px}
.mcl{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .15s,color .15s}
.mcl:hover{border-color:var(--gold);color:var(--gold)}
.mfr{flex:1;position:relative;background:#1a1a1a}
.mfr iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.ml{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted)}
.ml.gone{display:none}
.spin{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:rot .75s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{display:none;grid-column:1/-1;text-align:center;padding:80px 0;color:var(--muted)}
.empty.show{display:block}
.empty p{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300}
.empty small{font-size:12px;margin-top:8px;display:block}
@media(max-width:640px){header{padding:0 16px;gap:12px}.sb{max-width:none;flex:1}main{padding:16px 14px 60px}.sw{padding:0 14px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.modal{height:95vh}.mbg{padding:8px}}
</style>
</head>
<body>
<header>
  <div class="logo">TDV <em>/</em> Catalogue Library</div>
  <div class="sb">
    <input id="search" type="text" placeholder="Search…" autocomplete="off">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
  </div>
  <span id="count"></span>
</header>
<div class="sw"><div class="strip" id="strip"></div></div>
<main><div class="grid" id="grid"></div></main>
<div class="mbg" id="mbg">
  <div class="modal">
    <div class="mbar">
      <div class="minfo"><div class="mt" id="mt"></div><div class="mc" id="mc"></div></div>
      <button class="mcl" onclick="closeModal()">✕</button>
    </div>
    <div class="mfr" id="mfr">
      <div class="ml" id="ml"><div class="spin"></div><span style="font-size:12px">Loading…</span></div>
    </div>
  </div>

// ── THUMBNAIL & PREVIEW URLS ──────────────────────────────────
const thumb = id => `https://drive.google.com/thumbnail?id=${id}&sz=w480`;
const prev  = id => `https://drive.google.com/file/d/${id}/preview`;

const CAT_ORDER = ['Tiles','Natural Stone','Wood','Leather','Metal','Glass','Wall Covering','Flooring','Acoustic','Outdoor','Decorative','Furniture','Lighting','Door & Windows','Sanitary'];

let activeCat='All', q='';

function buildStrip(){
  const counts={};
  C.forEach(d=>{counts[d.c]=(counts[d.c]||0)+1;});
  const known=CAT_ORDER.filter(c=>counts[c]);
  const extra=Object.keys(counts).filter(c=>!CAT_ORDER.includes(c)).sort();
  const cats=['All',...known,...extra];
  const strip=document.getElementById('strip');
  cats.forEach(cat=>{
    const b=document.createElement('button');
    b.className='pill'+(cat==='All'?' on':'');
    const n=cat==='All'?C.length:(counts[cat]||0);
    b.innerHTML=`${esc(cat)} <span>${n}</span>`;
    b.onclick=()=>{activeCat=cat;strip.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));b.classList.add('on');filter();};
    strip.appendChild(b);
  });
}

function buildGrid(){
  const grid=document.getElementById('grid');
  C.forEach(d=>{
    const div=document.createElement('div');
    div.className='card';
    div.dataset.cat=d.c;
    div.dataset.title=d.t.toLowerCase();
    div.onclick=()=>openModal(d);
    const ti=d.j
      ?`<img src="${thumb(d.j)}" alt="${esc(d.t)}" loading="lazy" onerror="this.style.display='none'">`
      :`<div class="ph"><svg width="38" height="46" viewBox="0 0 38 46" fill="none" stroke="#fff" stroke-width="1.3"><rect x="1.5" y="1.5" width="35" height="43" rx="3"/><line x1="9" y1="13" x2="29" y2="13"/><line x1="9" y1="19" x2="29" y2="19"/><line x1="9" y1="25" x2="21" y2="25"/></svg><span>No thumbnail</span></div>`;
    div.innerHTML=`<div class="thumb">${ti}<div class="grad"></div><div class="ob">View</div></div><div class="meta"><div class="ct">${esc(d.c)}</div><div class="ttl">${esc(d.t)}</div></div>`;
    grid.appendChild(div);
  });
  const e=document.createElement('div');
  e.className='empty';e.id='empty';
  e.innerHTML='<p>No catalogues found</p><small>Try a different category or search</small>';
  grid.appendChild(e);
}

function filter(){
  const cards=document.querySelectorAll('.card');
  let n=0;
  cards.forEach(c=>{
    const ok=(activeCat==='All'||c.dataset.cat===activeCat)&&(!q||c.dataset.title.includes(q)||c.dataset.cat.toLowerCase().includes(q));
    c.classList.toggle('hide',!ok);if(ok)n++;
  });
  document.getElementById('count').textContent=n+' catalogue'+(n!==1?'s':'');
  const e=document.getElementById('empty');if(e)e.classList.toggle('show',n===0);
}

document.getElementById('search').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();filter();});

function openModal(d){
  document.getElementById('mt').textContent=d.t;
  document.getElementById('mc').textContent=d.c;
  document.getElementById('ml').classList.remove('gone');
  const fr=document.getElementById('mfr');
  const old=fr.querySelector('iframe');if(old)old.remove();
  const iframe=document.createElement('iframe');
  iframe.src=prev(d.p);iframe.allow='autoplay';iframe.setAttribute('allowfullscreen','');
  iframe.onload=()=>document.getElementById('ml').classList.add('gone');
  fr.appendChild(iframe);
  document.getElementById('mbg').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('mbg').classList.remove('open');
  document.body.style.overflow='';
  const fr=document.getElementById('mfr');
  const iframe=fr.querySelector('iframe');if(iframe)iframe.remove();
}

document.getElementById('mbg').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

buildStrip();buildGrid();filter();
</script>
