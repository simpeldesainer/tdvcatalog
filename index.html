<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDV — Catalogue Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0E0E0E;--surface:#181818;--card:#1C1C1C;
  --border:#2C2C2C;--gold:#C9A84C;--text:#F0EDE6;
  --muted:#7A7570;--pill:#222220;
}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--text);font-family:'DM Sans',sans-serif;
  font-weight:300;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(14,14,14,.96);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:20px;padding:0 32px;height:60px}
.logo{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:15px;
  letter-spacing:.28em;color:var(--gold);flex-shrink:0;white-space:nowrap}
.logo em{color:var(--muted);font-style:normal;letter-spacing:0}
.search-box{flex:1;max-width:300px;position:relative}
.search-box input{width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;font-size:13px;
  padding:7px 34px 7px 13px;border-radius:4px;outline:none;transition:border-color .2s}
.search-box input::placeholder{color:var(--muted)}
.search-box input:focus{border-color:var(--gold)}
.search-box svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
#count{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

/* STRIP */
.strip-wrap{position:sticky;top:60px;z-index:99;background:rgba(14,14,14,.93);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:0 24px}
.strip{display:flex;gap:4px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;background:var(--pill);border:1px solid var(--border);
  color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;
  font-size:11.5px;padding:5px 14px;border-radius:100px;cursor:pointer;
  transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;user-select:none}
.pill span{font-size:10px;opacity:.6}
.pill:hover{border-color:var(--gold);color:var(--text)}
.pill.on{background:var(--gold);border-color:var(--gold);color:#0E0E0E}
.pill.on span{opacity:.7}

/* GRID */
main{padding:28px 32px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}

/* CARD */
.card{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;
  background:var(--card);border:1px solid var(--border);
  transition:transform .22s,border-color .22s;aspect-ratio:3/4;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:#505050}
.card.hide{display:none}

/* THUMB */
.thumb{flex:1;position:relative;overflow:hidden;background:var(--surface)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;transition:transform .4s}
.card:hover .thumb img{transform:scale(1.05)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px}
.ph svg{opacity:.1}
.ph span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:.5}
.grad{position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.72)100%);pointer-events:none}
.open-btn{position:absolute;bottom:12px;right:12px;z-index:2;
  background:var(--gold);color:#0E0E0E;font-family:'DM Sans',sans-serif;
  font-weight:500;font-size:10px;letter-spacing:.05em;padding:5px 13px;
  border-radius:3px;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .2s}
.card:hover .open-btn{opacity:1;transform:translateY(0)}

/* META */
.meta{padding:10px 12px 12px;flex-shrink:0}
.cat-tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.ttl{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:15px;line-height:1.3}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.9);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{position:relative;width:100%;max-width:960px;height:90vh;
  background:#111;border:1px solid var(--border);border-radius:8px;
  overflow:hidden;display:flex;flex-direction:column}
.modal-bar{display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:#0E0E0E}
.modal-info .modal-title{font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:17px;color:var(--text)}
.modal-info .modal-cat{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin-top:2px}
.modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:none;color:var(--muted);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:border-color .15s,color .15s}
.modal-close:hover{border-color:var(--gold);color:var(--gold)}
.modal-frame{flex:1;position:relative;background:#1a1a1a}
.modal-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.modal-loader{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:12px;color:var(--muted)}
.modal-loader.gone{display:none}
.spin{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--gold);
  border-radius:50%;animation:rot .75s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* EMPTY */
.empty{display:none;grid-column:1/-1;text-align:center;padding:80px 0;color:var(--muted)}
.empty.show{display:block}
.empty p{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300}
.empty small{font-size:12px;margin-top:8px;display:block}

@media(max-width:640px){
  header{padding:0 16px;gap:12px}
  .search-box{max-width:none;flex:1}
  main{padding:16px 14px 60px}
  .strip-wrap{padding:0 14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .modal{height:95vh}
  .modal-bg{padding:8px}
}
</style>
</head>
<body>

<header>
  <div class="logo">TDV <em>/</em> Catalogue Library</div>
  <div class="search-box">
    <input id="search" type="text" placeholder="Search…" autocomplete="off">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
    </svg>
  </div>
  <span id="count"></span>
</header>

<div class="strip-wrap"><div class="strip" id="strip"></div></div>
<main><div class="grid" id="grid"></div></main>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-bar">
      <div class="modal-info">
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-cat" id="mCat"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-frame" id="mFrame">
      <div class="modal-loader" id="mLoader">
        <div class="spin"></div>
        <span style="font-size:12px">Loading…</span>
      </div>
    </div>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  CATALOGUE DATA — EDIT THIS SECTION TO ADD / REMOVE ITEMS   ║
// ║                                                              ║
// ║  HOW TO GET FILE IDs FROM GOOGLE DRIVE:                     ║
// ║  Right-click file → Share → Copy link                       ║
// ║  URL looks like: drive.google.com/file/d/XXXXXXX/view       ║
// ║  The XXXXXXX part is the File ID                            ║
// ║                                                              ║
// ║  thumbId → the JPEG file ID  (null = shows placeholder)     ║
// ║  pdfId   → the PDF file ID                                  ║
// ║                                                              ║
// ║  CATEGORIES (use exactly as written):                       ║
// ║  Tiles · Natural Stone · Wood · Leather · Metal · Glass     ║
// ║  Wall Covering · Flooring · Acoustic · Carpet · Decorative  ║
// ║  Outdoor · Furniture · Lighting · Door & Windows · Sanitary ║
// ╚══════════════════════════════════════════════════════════════╝

const CATALOGUES = [

  // ── TILES ──────────────────────────────────────────────────
  { title: "Resource Tiles Vol.1",           cat: "Tiles",         pdfId: "PASTE_PDF_ID_HERE",  thumbId: "PASTE_JPEG_ID_HERE" },
  { title: "Resource Tiles Vol.3",           cat: "Tiles",         pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "New China Building Materials",   cat: "Tiles",         pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

  // ── NATURAL STONE ──────────────────────────────────────────
  { title: "Sintered Stone Collection",      cat: "Natural Stone", pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Engineered Marble Grain Series", cat: "Natural Stone", pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Marble Particle Series",         cat: "Natural Stone", pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Terrazzo Del",                   cat: "Natural Stone", pdfId: "PASTE_PDF_ID_HERE",  thumbId: "PASTE_JPEG_ID_HERE" },
  { title: "Tiange Products 2025",           cat: "Natural Stone", pdfId: "1h6uVYmwjlef5ex_51HRLb4wgCLIRdYB-", thumbId: null },

  // ── WOOD ───────────────────────────────────────────────────
  { title: "Textured Wood Panels",           cat: "Wood",          pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Solid Wood Catalogue",           cat: "Wood",          pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Wood Panels & Veneer",           cat: "Wood",          pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Wood Grain Color Card",          cat: "Wood",          pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Marquetry Flooring",             cat: "Wood",          pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

  // ── LEATHER ────────────────────────────────────────────────
  { title: "Leather Art Collection",         cat: "Leather",       pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

  // ── METAL ──────────────────────────────────────────────────
  { title: "Stainless Steel Products",       cat: "Metal",         pdfId: "1bZjm9jGuP2L73VlW7wXSoz2chQ_NRy2u", thumbId: null },
  { title: "Aluminium Profiles 2020",        cat: "Metal",         pdfId: "1kCemfnX6kiwptvzBeYpv1kAyYjJK8rXk", thumbId: null },
  { title: "Jingsong Aluminum 2025",         cat: "Metal",         pdfId: "1rSagARj9Lf9y2YuFovPTL9vKwe1j4l4v", thumbId: null },

  // ── GLASS ──────────────────────────────────────────────────
  { title: "Glass Collection",               cat: "Glass",         pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

  // ── WALL COVERING ──────────────────────────────────────────
  { title: "Soft Rolls Texture",             cat: "Wall Covering", pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

  // ── ACOUSTIC ───────────────────────────────────────────────
  { title: "Resource Felt Panels",           cat: "Acoustic",      pdfId: "1UjepED2XWvDvL_rMJrfijo3Rwj8Rj-ph", thumbId: null },
  { title: "Deco Sound Acoustic",            cat: "Acoustic",      pdfId: "1VDvxbkowFs9FDj0SLvFUzNVSi-6F0Fzb", thumbId: null },

  // ── CARPET ─────────────────────────────────────────────────
  { title: "Carpet Collection AW",           cat: "Carpet",        pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Carpet Collection HX",           cat: "Carpet",        pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

  // ── DECORATIVE ─────────────────────────────────────────────
  { title: "Gilded Panel Catalog",           cat: "Decorative",    pdfId: "1GhDbXeDKrPyjubHbXMnCX3JWNeMlSrCe", thumbId: null },
  { title: "Fudayingjia Decorative",         cat: "Decorative",    pdfId: "1QAbML8dzwPVSQOcS29aCU5YFjaBQSYdi", thumbId: null },
  { title: "Customised Floral Arrangements", cat: "Decorative",    pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

  // ── FURNITURE ──────────────────────────────────────────────
  { title: "Furniture Catalogue",            cat: "Furniture",     pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Sofa Collection",                cat: "Furniture",     pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Rattan & Bamboo",                cat: "Furniture",     pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "System Carpentry",               cat: "Furniture",     pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Home Furnishing",                cat: "Furniture",     pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

  // ── LIGHTING ───────────────────────────────────────────────
  { title: "Customised Lighting & Chandeliers", cat: "Lighting",   pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },
  { title: "Handmade Chandeliers",           cat: "Lighting",      pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

  // ── DOOR & WINDOWS ─────────────────────────────────────────
  { title: "Panoramic Sliding Door",         cat: "Door & Windows", pdfId: "1DKUAL7xltNXkrVc6RszgFxK0exijLYQY", thumbId: null },
  { title: "Doors & Windows Brochure 2025",  cat: "Door & Windows", pdfId: "1_g7cfx7SAByPZ99LnFTjYS7AsVtKXcMo", thumbId: null },

  // ── SANITARY ───────────────────────────────────────────────
  { title: "Magic Stone Sanitary Ware",      cat: "Sanitary",      pdfId: "1Su2EAnUW2CUFnHEcD1MRkYvSKzU6tIKj", thumbId: null },

  // ── OUTDOOR ────────────────────────────────────────────────
  { title: "Resource Outdoor Collection",    cat: "Outdoor",       pdfId: "PASTE_PDF_ID_HERE",  thumbId: null },

];

// ═══════════════════════════════════════════════════════════════
//  BELOW THIS LINE — DO NOT EDIT
// ═══════════════════════════════════════════════════════════════

const CAT_ORDER = [
  'Tiles','Natural Stone','Wood','Leather','Metal','Glass',
  'Wall Covering','Flooring','Acoustic','Carpet','Decorative',
  'Outdoor','Furniture','Lighting','Door & Windows','Sanitary'
];

// Drive URL builders
const thumbUrl = id => `https://drive.google.com/thumbnail?id=${id}&sz=w480`;
const previewUrl = id => `https://drive.google.com/file/d/${id}/preview`;

let activeCat = 'All', q = '';

// ── BUILD CATEGORY STRIP ──────────────────────────────────────
function buildStrip() {
  const counts = {};
  CATALOGUES.forEach(c => { counts[c.cat] = (counts[c.cat]||0)+1; });
  const known = CAT_ORDER.filter(c => counts[c]);
  const extra = Object.keys(counts).filter(c => !CAT_ORDER.includes(c)).sort();
  const cats  = ['All', ...known, ...extra];
  const strip = document.getElementById('strip');
  cats.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'pill' + (cat==='All'?' on':'');
    const n = cat==='All' ? CATALOGUES.length : (counts[cat]||0);
    b.innerHTML = `${esc(cat)} <span>${n}</span>`;
    b.onclick = () => {
      activeCat = cat;
      strip.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));
      b.classList.add('on');
      filter();
    };
    strip.appendChild(b);
  });
}

// ── BUILD GRID ────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('grid');
  CATALOGUES.forEach(c => {
    if (c.pdfId === 'PASTE_PDF_ID_HERE') return; // skip empty placeholders

    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.cat   = c.cat;
    div.dataset.title = c.title.toLowerCase();
    div.onclick = () => openModal(c);

    const thumbHtml = (c.thumbId && c.thumbId !== 'PASTE_JPEG_ID_HERE')
      ? `<img src="${thumbUrl(c.thumbId)}" alt="${esc(c.title)}" loading="lazy"
             onerror="this.style.display='none'">`
      : `<div class="ph">
           <svg width="38" height="46" viewBox="0 0 38 46" fill="none" stroke="#fff" stroke-width="1.3">
             <rect x="1.5" y="1.5" width="35" height="43" rx="3"/>
             <line x1="9" y1="13" x2="29" y2="13"/>
             <line x1="9" y1="19" x2="29" y2="19"/>
             <line x1="9" y1="25" x2="21" y2="25"/>
           </svg>
           <span>No thumbnail yet</span>
         </div>`;

    div.innerHTML = `
      <div class="thumb">
        ${thumbHtml}
        <div class="grad"></div>
        <div class="open-btn">View Catalogue</div>
      </div>
      <div class="meta">
        <div class="cat-tag">${esc(c.cat)}</div>
        <div class="ttl">${esc(c.title)}</div>
      </div>`;
    grid.appendChild(div);
  });

  const empty = document.createElement('div');
  empty.className = 'empty'; empty.id = 'empty';
  empty.innerHTML = '<p>No catalogues found</p><small>Try a different category or search</small>';
  grid.appendChild(empty);
}

// ── FILTER ────────────────────────────────────────────────────
function filter() {
  const cards = document.querySelectorAll('.card');
  let n = 0;
  cards.forEach(c => {
    const ok = (activeCat==='All' || c.dataset.cat===activeCat) &&
               (!q || c.dataset.title.includes(q) || c.dataset.cat.toLowerCase().includes(q));
    c.classList.toggle('hide', !ok);
    if (ok) n++;
  });
  document.getElementById('count').textContent = n + ' catalogue' + (n!==1?'s':'');
  const e = document.getElementById('empty');
  if (e) e.classList.toggle('show', n===0);
}

document.getElementById('search').addEventListener('input', e => {
  q = e.target.value.toLowerCase().trim(); filter();
});

// ── PDF MODAL ─────────────────────────────────────────────────
function openModal(c) {
  document.getElementById('mTitle').textContent = c.title;
  document.getElementById('mCat').textContent   = c.cat;
  document.getElementById('mLoader').classList.remove('gone');

  const frame = document.getElementById('mFrame');
  const old   = frame.querySelector('iframe');
  if (old) old.remove();

  const iframe = document.createElement('iframe');
  iframe.src   = previewUrl(c.pdfId);
  iframe.allow = 'autoplay';
  iframe.setAttribute('allowfullscreen','');
  iframe.onload = () => document.getElementById('mLoader').classList.add('gone');
  frame.appendChild(iframe);

  document.getElementById('modalBg').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
  document.body.style.overflow = '';
  const frame = document.getElementById('mFrame');
  const iframe = frame.querySelector('iframe');
  if (iframe) iframe.remove();
}

document.getElementById('modalBg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──────────────────────────────────────────────────────
buildStrip();
buildGrid();
filter();
</script>
</body>
</html>
